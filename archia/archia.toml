[[agent.tools]]
name = "calculate_agricultural_vulnerability"
description = "Calculate agricultural vulnerability score for a county based on crop yield stability, diversity, and drought exposure. Returns vulnerability assessment."
handler = "ResilienceAgent.calculate_agricultural_vulnerability"

[[agent.tools.parameters]]
name = "county_fips"
type = "string"
description = "County FIPS code"
required = true

[[agent.tools.parameters]]
name = "county_name"
type = "string"
description = "County name"
required = true

[[agent.tools.parameters]]
name = "state"
type = "string"
description = "State abbreviation"
required = true

[[agent.tools]]
name = "assess_food_security_risk"
description = "Assess food security risk based on local agricultural production capacity vs population. Identifies counties dependent on food imports."
handler = "ResilienceAgent.assess_food_security_risk"

[[agent.tools.parameters]]
name = "county_fips"
type = "string"
description = "County FIPS code"
required = true

[[agent.tools.parameters]]
name = "county_name"
type = "string"
description = "County name"
required = true

[[agent.tools.parameters]]
name = "state"
type = "string"
description = "State abbreviation"
required = true

[[agent.tools.parameters]]
name = "population"
type = "integer"
description = "County population (if known)"
required = false

[[agent.tools]]
name = "get_state_crop_summary"
description = "Get summary of all major crops for a state including average yields, top producing counties, and production trends."
handler = "ResilienceAgent.get_state_crop_summary"

[[agent.tools.parameters]]
name = "state"
type = "string"
description = "Two-letter state code"
required = true

[[agent.tools.parameters]]
name = "year"
type = "integer"
description = "Optional: Specific year"
required = false

# Server Configuration
[server]
host = "0.0.0.0"
port = 8080
workers = 4
log_level = "info"
api_key = "ask_wbkaHYsVv6yiaBMBko3VU_YZ9Bonga3nThObPyKJwwA="

# Data paths
[server.data]
county_features = "/data/processed/county_features.csv"
models_dir = "/data/models"
reports_dir = "/data/reports"

# Security
[server.security]
cors_origins = ["*"]
api_key_header = "X-API-Key"
rate_limit = 100

# Health check
[server.health]
endpoint = "/health"
interval = 30

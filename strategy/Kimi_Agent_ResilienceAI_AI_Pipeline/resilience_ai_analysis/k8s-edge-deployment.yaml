apiVersion: v1
kind: Namespace
metadata:
  name: resilience-edge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-config
  namespace: resilience-edge
data:
  config.yaml: |
    node:
      id: "edge-node-01"
      location:
        lat: 40.7128
        lon: -74.0060
      capabilities:
        - ml_inference
        - data_collection
        - video_processing
    sync:
      interval_seconds: 300
      batch_size: 100
      compression: true
    inference:
      threads: 4
      batch_size: 1
      use_gpu: true
    cache:
      memory_limit_mb: 512
      ssd_limit_gb: 10
---
apiVersion: v1
kind: Secret
metadata:
  name: edge-secrets
  namespace: resilience-edge
type: Opaque
stringData:
  api-key: "your-api-key-here"
  db-password: "your-db-password-here"
  jwt-secret: "your-jwt-secret-here"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-inference
  namespace: resilience-edge
  labels:
    app: edge-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edge-inference
  template:
    metadata:
      labels:
        app: edge-inference
    spec:
      nodeSelector:
        node-type: edge
      containers:
        - name: inference
          image: resilienceai/edge-inference:v1.0.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: 1
            limits:
              memory: "8Gi"
              cpu: "4"
              nvidia.com/gpu: 1
          env:
            - name: MODEL_PATH
              value: "/models"
            - name: CONFIG_PATH
              value: "/config/config.yaml"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: cache
              mountPath: /cache
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-pvc
        - name: config
          configMap:
            name: edge-config
        - name: cache
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-service
  namespace: resilience-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sync-service
  template:
    metadata:
      labels:
        app: sync-service
    spec:
      containers:
        - name: sync
          image: resilienceai/sync-service:v1.0.0
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: edge-secrets
                  key: api-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: edge-secrets
                  key: db-password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: edge-inference-service
  namespace: resilience-edge
spec:
  selector:
    app: edge-inference
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge-inference-hpa
  namespace: resilience-edge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge-inference
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-pvc
  namespace: resilience-edge
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: fast-ssd

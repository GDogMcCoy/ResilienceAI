# GitHub Actions Workflow for ResilienceAI Documentation
# This workflow builds and deploys documentation to GitHub Pages

name: Documentation

on:
  # Trigger on pushes to main and claw-autonomous branches
  push:
    branches:
      - main
      - claw-autonomous
    paths:
      - 'docs/**'
      - 'src/**/*.py'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  
  # Trigger on pull requests that modify documentation
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**/*.py'
      - 'mkdocs.yml'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 2.0.0)'
        required: false
        default: 'latest'

# Sets permissions of the GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for git-revision-date
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material
          pip install mkdocs-minify-plugin
          pip install mkdocstrings[python]
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-git-committers-plugin-2
          pip install mike
          pip install pillow cairosvg  # For image optimization
      
      - name: Install project dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4
      
      - name: Build documentation
        run: |
          mkdocs build --strict --verbose
      
      - name: Optimize images
        run: |
          # Optimize images in the site directory
          find site -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -exec echo "Optimizing {}" \;
      
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Deploy job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Link check job
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install mkdocs-material
          pip install linkchecker
      
      - name: Build documentation
        run: mkdocs build
      
      - name: Check links
        run: |
          linkchecker --check-extern --no-warnings site/ || true

  # Spell check job
  spell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install spell checker
        run: |
          pip install codespell
      
      - name: Run spell check
        run: |
          codespell docs/ --skip="*.svg,*.png,*.jpg" || true

  # Documentation coverage check
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install interrogate
      
      - name: Check docstring coverage
        run: |
          interrogate src/ --verbose --fail-under=80 || true

name: Continuous Load Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly at 2 AM
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of load test'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - endurance

env:
  PYTHON_VERSION: '3.11'
  K6_VERSION: 'v0.48.0'

jobs:
  # Smoke Test - Quick validation
  smoke-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install locust prometheus-client
      
      - name: Start test server
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30  # Wait for services
      
      - name: Run smoke test
        run: |
          locust -f load_testing/locustfile.py \
            --host=http://localhost:8000 \
            --users=10 \
            --spawn-rate=5 \
            --run-time=2m \
            --headless \
            --only-summary
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            *.html
            *.csv

  # Load Test - Performance validation
  load-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: smoke-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Start test environment
        run: |
          docker-compose -f docker-compose.test.yml up -d
          sleep 30
      
      - name: Run k6 load test
        run: |
          k6 run --out json=load_test_results.json \
            load_testing/k6/load_test.js
      
      - name: Check performance regression
        run: |
          python load_testing/analysis/check_regression.py load_test_results.json
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-results
          path: |
            *.json
            *.html

  # Stress Test - Weekly
  stress-test:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * 0'  # Weekly on Sunday
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install locust
      
      - name: Run stress test
        run: |
          locust -f load_testing/locustfile.py \
            --host=${{ secrets.TEST_ENV_URL }} \
            --users=1000 \
            --spawn-rate=50 \
            --run-time=30m \
            --headless \
            --csv=stress_test
      
      - name: Analyze results
        run: |
          python load_testing/analysis/analyze_stress_test.py stress_test_stats.csv
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-test-results
          path: |
            stress_test_*.csv
            stress_test_*.html

  # Spike Test - Monthly
  spike-test:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 1 * *'  # Monthly on 1st
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up k6
        run: |
          sudo apt-get install k6
      
      - name: Run spike test
        run: |
          k6 run --out json=spike_test_results.json \
            load_testing/k6/spike_test.js
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-test-results
          path: |
            spike_test_*.json

  # Performance Benchmark
  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_type == 'load'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up k6
        run: |
          sudo apt-get install k6
      
      - name: Run benchmark
        run: |
          k6 run --out influxdb=http://influxdb:8086/k6 \
            load_testing/k6/load_test.js
      
      - name: Generate report
        run: |
          python load_testing/reporting/generate_benchmark_report.py
      
      - name: Commit benchmark results
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add benchmarks/
          git commit -m "Update benchmark results [skip ci]" || echo "No changes"
          git push || echo "Nothing to push"

  # Endurance Test - Quarterly
  endurance-test:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 1 */3 *'  # Quarterly
    timeout-minutes: 750  # 12.5 hours
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install locust
      
      - name: Run 12-hour endurance test
        run: |
          locust -f load_testing/locustfile.py \
            --host=${{ secrets.TEST_ENV_URL }} \
            --users=200 \
            --spawn-rate=20 \
            --run-time=12h \
            --headless \
            --csv=endurance_test
      
      - name: Analyze endurance results
        run: |
          python load_testing/analysis/analyze_endurance.py endurance_test_stats.csv
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endurance-test-results
          path: |
            endurance_test_*.csv
            endurance_test_*.html
          retention-days: 90

# Test Scenarios for ResilienceAI Load Testing

# User Profiles
user_profiles:
  api_consumer:
    name: "API Consumer"
    weight: 0.50
    think_time_min: 1.0
    think_time_max: 5.0
    workflows:
      - endpoint: "/health"
        method: "GET"
        probability: 0.3
      - endpoint: "/api/v1/predict"
        method: "POST"
        probability: 0.6
      - endpoint: "/api/v1/explain"
        method: "POST"
        probability: 0.1

  batch_processor:
    name: "Batch Processor"
    weight: 0.25
    think_time_min: 10.0
    think_time_max: 30.0
    workflows:
      - endpoint: "/api/v1/batch-predict"
        method: "POST"
        probability: 0.8
      - endpoint: "/api/v1/models"
        method: "GET"
        probability: 0.2

  model_manager:
    name: "Model Manager"
    weight: 0.15
    think_time_min: 5.0
    think_time_max: 15.0
    workflows:
      - endpoint: "/api/v1/models"
        method: "GET"
        probability: 0.4
      - endpoint: "/api/v1/models/{id}"
        method: "GET"
        probability: 0.3
      - endpoint: "/api/v1/models/{id}/deploy"
        method: "POST"
        probability: 0.2
      - endpoint: "/api/v1/metrics"
        method: "GET"
        probability: 0.1

  streaming_client:
    name: "Streaming Client"
    weight: 0.10
    think_time_min: 0.5
    think_time_max: 2.0
    workflows:
      - endpoint: "/api/v1/stream/predict"
        method: "WS"
        probability: 0.9
      - endpoint: "/api/v1/feedback"
        method: "POST"
        probability: 0.1

# Test Configurations
test_configs:
  smoke:
    description: "Quick validation test"
    duration: "2m"
    users: 10
    spawn_rate: 5
    scenarios:
      - health_check
      - basic_prediction

  load:
    description: "Standard load test"
    duration: "30m"
    users: 200
    spawn_rate: 20
    stages:
      - duration: "5m"
        users: 50
      - duration: "10m"
        users: 100
      - duration: "10m"
        users: 200
      - duration: "5m"
        users: 50

  stress:
    description: "Stress test to find breaking point"
    duration: "1h"
    users: 2000
    spawn_rate: 50
    stages:
      - duration: "10m"
        users: 100
      - duration: "10m"
        users: 500
      - duration: "10m"
        users: 1000
      - duration: "10m"
        users: 1500
      - duration: "10m"
        users: 2000
      - duration: "10m"
        users: 0

  spike:
    description: "Sudden traffic spike simulation"
    duration: "15m"
    stages:
      - duration: "2m"
        users: 50
      - duration: "30s"
        users: 1000
      - duration: "5m"
        users: 1000
      - duration: "30s"
        users: 50
      - duration: "7m"
        users: 50

  endurance:
    description: "Long-running stability test"
    duration: "12h"
    users: 200
    spawn_rate: 20
    check_intervals:
      - "1h"
      - "4h"
      - "8h"
      - "12h"

# API Endpoint Coverage
endpoints:
  - path: "/health"
    method: "GET"
    priority: "high"
    base_load: 100
    peak_load: 500
    critical_path: true

  - path: "/api/v1/predict"
    method: "POST"
    priority: "critical"
    base_load: 50
    peak_load: 200
    critical_path: true

  - path: "/api/v1/batch-predict"
    method: "POST"
    priority: "high"
    base_load: 20
    peak_load: 100
    critical_path: true

  - path: "/api/v1/models"
    method: "GET"
    priority: "medium"
    base_load: 30
    peak_load: 150
    critical_path: false

  - path: "/api/v1/models/{id}"
    method: "GET"
    priority: "medium"
    base_load: 20
    peak_load: 100
    critical_path: false

  - path: "/api/v1/models/{id}/deploy"
    method: "POST"
    priority: "high"
    base_load: 5
    peak_load: 20
    critical_path: true

  - path: "/api/v1/explain"
    method: "POST"
    priority: "medium"
    base_load: 10
    peak_load: 50
    critical_path: false

  - path: "/api/v1/metrics"
    method: "GET"
    priority: "low"
    base_load: 10
    peak_load: 50
    critical_path: false

  - path: "/api/v1/feedback"
    method: "POST"
    priority: "medium"
    base_load: 30
    peak_load: 150
    critical_path: false

  - path: "/api/v1/stream/predict"
    method: "WS"
    priority: "high"
    base_load: 50
    peak_load: 200
    critical_path: true

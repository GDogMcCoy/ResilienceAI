; ============================================
; RESILIENCEAI PGBOUNCER CONFIGURATION
; Connection pooling for PostgreSQL
; ============================================

[databases]
; Map connection names to actual databases
; Format: alias = host=HOST port=PORT dbname=DBNAME

; Primary application database
resilienceai = host=localhost port=5432 dbname=resilienceai

; Read replica (if configured)
resilienceai_ro = host=localhost port=5432 dbname=resilienceai

; TimescaleDB (same database, different connection pool)
resilienceai_timescale = host=localhost port=5432 dbname=resilienceai

; Admin database
postgres = host=localhost port=5432 dbname=postgres

[pgbouncer]
; ============================================
; CONNECTION SETTINGS
; ============================================

; IP address to listen on
listen_addr = 0.0.0.0

; Port to listen on
listen_port = 6432

; Unix socket directory (alternative to TCP)
;unix_socket_dir = /var/run/postgresql

; Authentication type
;   md5: MD5 password authentication
;   scram-sha-256: SCRAM-SHA-256 authentication (PostgreSQL 10+)
;   pam: PAM authentication
;   hba: use pg_hba.conf
;   cert: client certificate authentication
auth_type = md5

; User authentication file
; Format: "username" "password"
auth_file = /etc/pgbouncer/userlist.txt

; HBA configuration file (if auth_type = hba)
;auth_hba_file = /etc/pgbouncer/pg_hba.conf

; ============================================
; POOL SETTINGS
; ============================================

; Pool mode
;   session: Connection returned to pool after client disconnects
;   transaction: Connection returned after each transaction
;   statement: Connection returned after each statement
; For ResilienceAI (web application), transaction mode is recommended
pool_mode = transaction

; Maximum number of client connections
max_client_conn = 1000

; Default pool size per database/user
default_pool_size = 25

; Minimum pool size per database/user
min_pool_size = 5

; Additional connections for emergencies
reserve_pool_size = 5

; How long to wait for reserve pool connection (seconds)
reserve_pool_timeout = 3

; Maximum number of connections per database/user
max_db_connections = 100
max_user_connections = 100

; ============================================
; TIMEOUTS
; ============================================

; Close idle server connections after this time (seconds)
server_idle_timeout = 600

; Close server connections after this lifetime (seconds)
server_lifetime = 3600

; Timeout for connecting to server (seconds)
server_connect_timeout = 15

; Timeout for queries (0 = disabled)
query_timeout = 0

; Timeout for waiting for query slot (seconds)
query_wait_timeout = 120

; Timeout for idle clients (0 = disabled)
client_idle_timeout = 0

; Timeout for login (seconds)
client_login_timeout = 60

; Timeout for idle transactions (seconds)
idle_transaction_timeout = 0

; ============================================
; LOGGING
; ============================================

; Log file
logfile = /var/log/pgbouncer/pgbouncer.log

; PID file
pidfile = /var/run/pgbouncer/pgbouncer.pid

; Log connections
log_connections = 1

; Log disconnections
log_disconnections = 1

; Log pooler errors
log_pooler_errors = 1

; Stats period (seconds)
stats_period = 60

; Verbose logging (0=disabled, 1=enabled)
verbose = 0

; ============================================
; ADMIN CONSOLE
; ============================================

; Admin users (can connect to special pgbouncer database)
admin_users = postgres, pgbouncer_admin

; Stats users (can connect to pgbouncer database for stats)
stats_users = stats_collector, monitoring

; ============================================
; TLS/SSL SETTINGS (Production)
; ============================================

; Client TLS mode
;   disable: TLS disabled
;   allow: TLS optional
;   prefer: TLS preferred
;   require: TLS required
;   verify-ca: TLS with CA verification
;   verify-full: TLS with full verification
;client_tls_sslmode = prefer

; Client TLS key file
;client_tls_key_file = /etc/ssl/private/pgbouncer.key

; Client TLS certificate file
;client_tls_cert_file = /etc/ssl/certs/pgbouncer.crt

; Client TLS CA file
;client_tls_ca_file = /etc/ssl/certs/ca.crt

; Client TLS CRL file
;client_tls_crl_file = /etc/ssl/certs/pgbouncer.crl

; Server TLS mode
;server_tls_sslmode = prefer

; Server TLS key file
;server_tls_key_file = /etc/ssl/private/pgbouncer-server.key

; Server TLS certificate file
;server_tls_cert_file = /etc/ssl/certs/pgbouncer-server.crt

; ============================================
; PERFORMANCE TUNING
; ============================================

; Number of worker processes (for high connection counts)
;workers = 4

; DNS maximum TTL (seconds)
dns_max_ttl = 15

; DNS zone TTL (seconds)
dns_zone_check_period = 60

; DNS lookup cache (seconds)
resolv_conf = /etc/resolv.conf

; ============================================
; HEALTH CHECK
; ============================================

; Enable server health checks
server_check_query = select 1
server_check_delay = 10

; ============================================
; MISCELLANEOUS
; ============================================

; Application name to add to connection
;application_name_add_host = 1

; Disable Simple Query protocol (use Extended Query only)
;disable_pqexec = 0

; Maximum packet size
;max_packet_size = 2147483647

; Listen backlog
;listen_backlog = 128

; Synchronous mode (for replication)
;synchronous_commit = off

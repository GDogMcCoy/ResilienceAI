apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: resilience-ai-prometheus
  namespace: monitoring
spec:
  serviceAccountName: prometheus
  serviceMonitorSelector:
    matchLabels:
      app: resilience-ai
  podMonitorSelector:
    matchLabels:
      app: resilience-ai
  retention: 30d
  retentionSize: 50GB
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 8Gi
      cpu: 2000m
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: standard
        resources:
          requests:
            storage: 100Gi
  additionalScrapeConfigs:
  # Istio metrics
  - job_name: 'istio-mesh'
    kubernetes_sd_configs:
    - role: endpoints
      namespaces:
        names:
        - istio-system
    relabel_configs:
    - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
      action: keep
      regex: istio-proxy;http-envoy-prom
  
  # Envoy stats
  - job_name: 'envoy-stats'
    kubernetes_sd_configs:
    - role: pod
      namespaces:
        names:
        - resilience-ai
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_container_port_name]
      action: keep
      regex: .*-envoy-prom
    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:15090
      target_label: __address__
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: resilience-ai-services
  namespace: monitoring
  labels:
    app: resilience-ai
spec:
  namespaceSelector:
    matchNames:
    - resilience-ai
  selector:
    matchLabels:
      app: resilience-ai
  endpoints:
  - port: http-metrics
    interval: 15s
    path: /metrics
  - port: envoy-metrics
    interval: 15s
    path: /stats/prometheus

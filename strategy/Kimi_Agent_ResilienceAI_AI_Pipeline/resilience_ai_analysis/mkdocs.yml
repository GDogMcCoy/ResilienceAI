# ResilienceAI Documentation Configuration
# MkDocs with Material theme
# Reference: https://squidfunk.github.io/mkdocs-material/

site_name: ResilienceAI
site_description: >-
  AI-powered disaster vulnerability intelligence platform combining 
  FEMA disaster data, Census demographics, HIFLD infrastructure, 
  and real-time NOAA weather feeds for county-level risk assessment.
site_author: ResilienceAI Team
site_url: https://resilienceai.readthedocs.io
copyright: Copyright &copy; 2026 ResilienceAI Team | MIT License

# Repository information
repo_name: GDogMcCoy/ResilienceAI
repo_url: https://github.com/GDogMcCoy/ResilienceAI
edit_uri: edit/main/docs/

# Documentation directory
docs_dir: docs

# Theme configuration
theme:
  name: material
  
  # Color palette with light/dark mode toggle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Font configuration
  font:
    text: Inter
    code: JetBrains Mono
  
  # Logo and favicon
  icon:
    logo: fontawesome/solid/shield-heart
    repo: fontawesome/brands/github
  
  # Features
  features:
    - navigation.tabs           # Top-level navigation tabs
    - navigation.tabs.sticky    # Keep tabs visible when scrolling
    - navigation.sections       # Render sections as groups
    - navigation.expand         # Expand all collapsible sections
    - navigation.top            # Back-to-top button
    - navigation.footer         # Previous/next navigation
    - search.suggest            # Search suggestions
    - search.highlight          # Highlight search terms
    - search.share              # Shareable search URLs
    - content.tabs.link         # Link content tabs
    - content.code.annotate     # Code annotations
    - content.code.copy         # Copy code button
    - content.action.edit       # Edit page button
    - content.action.view       # View source button

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
      minify_js: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_object_full_path: true
            show_category_heading: true
            show_if_no_docstring: false
            show_signature: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80
            merge_init_into_class: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - git-committers:
      repository: GDogMcCoy/ResilienceAI
      branch: main

# Markdown extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

# Extra social links and configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GDogMcCoy/ResilienceAI
      name: GitHub Repository
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/resilienceai
      name: PyPI Package
  
  version:
    provider: mike
    default: latest
  
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.


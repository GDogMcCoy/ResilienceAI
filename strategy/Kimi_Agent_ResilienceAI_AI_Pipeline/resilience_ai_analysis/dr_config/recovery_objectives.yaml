# Recovery Objectives Configuration for ResilienceAI

recovery_objectives:
  # Tier 1: Mission Critical
  tier_1:
    description: "Core AI inference and authentication services"
    services:
      - ai_inference_api
      - authentication_service
      - rate_limiter
      - api_gateway
    rto: "5m"
    rpo: "0m"
    strategy: "active_active"
    auto_failover: true
    health_check_interval: "10s"
    
  # Tier 2: Business Critical  
  tier_2:
    description: "Model serving and data processing"
    services:
      - model_serving
      - data_pipeline
      - feature_store
      - vector_database
    rto: "15m"
    rpo: "5m"
    strategy: "hot_standby"
    auto_failover: true
    health_check_interval: "30s"
    
  # Tier 3: Important
  tier_3:
    description: "Analytics and reporting"
    services:
      - analytics_engine
      - reporting_service
      - dashboard_service
      - audit_logs
    rto: "1h"
    rpo: "15m"
    strategy: "warm_standby"
    auto_failover: false
    health_check_interval: "1m"
    
  # Tier 4: Standard
  tier_4:
    description: "Batch jobs and archives"
    services:
      - batch_processor
      - data_archive
      - ml_training_jobs
      - log_aggregation
    rto: "24h"
    rpo: "1h"
    strategy: "cold_standby"
    auto_failover: false
    health_check_interval: "5m"

# Recovery metrics tracking
metrics:
  measurement_frequency: "1m"
  alert_thresholds:
    rto_exceeded: "critical"
    rpo_exceeded: "critical"
    failover_failed: "critical"
    backup_failed: "high"
    
  dashboards:
    - name: "DR Health Dashboard"
      url: "/dashboards/dr-health"
    - name: "RTO/RPO Compliance"
      url: "/dashboards/recovery-metrics"

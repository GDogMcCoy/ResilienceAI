# Communication Plan for ResilienceAI Disaster Recovery

communication_plan:
  version: "1.0"
  last_updated: "2024-01-15"
  
  # Communication Channels
  channels:
    internal:
      - name: "Slack"
        purpose: "Real-time team communication"
        channels:
          - "#incidents"
          - "#engineering-alerts"
          - "#dr-team"
          - "#executive-updates"
        
      - name: "PagerDuty"
        purpose: "On-call alerting and escalation"
        integrations:
          - "Monitoring alerts"
          - "Incident creation"
          - "Escalation policies"
        
      - name: "Zoom"
        purpose: "Incident bridge calls"
        setup: "Automatic bridge for P1/P2 incidents"
        
      - name: "Email"
        purpose: "Formal communications and updates"
        distribution_lists:
          - "engineering-team@resilienceai.io"
          - "executives@resilienceai.io"
          - "customers@resilienceai.io"
    
    external:
      - name: "Status Page"
        provider: "Statuspage.io"
        url: "https://status.resilienceai.io"
        auto_update: true
        
      - name: "Twitter"
        handle: "@ResilienceAI"
        purpose: "Public status updates"
        
      - name: "Customer Portal"
        purpose: "Detailed incident information"
        url: "https://portal.resilienceai.io/status"
  
  # Communication Templates
  templates:
    incident_detected:
      slack: |
        🚨 *INCIDENT DETECTED* 🚨
        
        *Incident ID:* {{incident_id}}
        *Title:* {{title}}
        *Severity:* {{severity}}
        *Type:* {{type}}
        *Detected:* {{detected_at}}
        
        *Affected Services:*
        {{#affected_services}}
        • {{.}}
        {{/affected_services}}
        
        *Description:*
        {{description}}
        
        Incident Commander will be assigned shortly.
      
      email:
        subject: "[INCIDENT] {{severity}}: {{title}}"
        body: |
          An incident has been detected and is being investigated.
          
          Incident Details:
          - ID: {{incident_id}}
          - Severity: {{severity}}
          - Detected: {{detected_at}}
          
          We will provide updates every 30 minutes.
    
    incident_resolved:
      slack: |
        ✅ *INCIDENT RESOLVED* ✅
        
        *Incident ID:* {{incident_id}}
        *Title:* {{title}}
        *Duration:* {{duration}}
        *Resolved By:* {{resolved_by}}
        
        All services are now operating normally.
        
        A post-mortem will be conducted within 48 hours.
      
      status_page: |
        Resolved - {{title}}
        
        This incident has been resolved. All systems are operational.
        
        We apologize for any inconvenience caused.
    
    scheduled_maintenance:
      status_page: |
        Scheduled Maintenance - {{maintenance_title}}
        
        We will be performing scheduled maintenance on {{start_time}}.
        
        *Expected Duration:* {{duration}}
        *Affected Services:* {{affected_services}}
        *Impact:* {{impact_description}}
        
        We expect minimal disruption during this window.
  
  # Communication Schedules
  schedules:
    p1_critical:
      internal:
        - time: "immediate"
          audience: "engineering-team"
          channel: "slack"
          template: "incident_detected"
        
        - time: "immediate"
          audience: "executives"
          channel: "email"
          template: "executive_notification"
        
        - time: "every_15_minutes"
          audience: "all-stakeholders"
          channel: "slack"
          template: "status_update"
      
      external:
        - time: "immediate"
          audience: "customers"
          channel: "status_page"
          template: "incident_detected"
        
        - time: "every_30_minutes"
          audience: "customers"
          channel: "status_page"
          template: "status_update"
    
    p2_high:
      internal:
        - time: "immediate"
          audience: "engineering-team"
          channel: "slack"
          template: "incident_detected"
        
        - time: "every_30_minutes"
          audience: "engineering-team"
          channel: "slack"
          template: "status_update"
      
      external:
        - time: "15_minutes"
          audience: "customers"
          channel: "status_page"
          template: "incident_detected"
        
        - time: "every_60_minutes"
          audience: "customers"
          channel: "status_page"
          template: "status_update"
    
    p3_medium:
      internal:
        - time: "immediate"
          audience: "engineering-team"
          channel: "slack"
          template: "incident_detected"
        
        - time: "every_60_minutes"
          audience: "engineering-team"
          channel: "slack"
          template: "status_update"
      
      external:
        - time: "next_business_day"
          audience: "customers"
          channel: "status_page"
          template: "incident_summary"
    
    p4_low:
      internal:
        - time: "next_business_day"
          audience: "engineering-team"
          channel: "slack"
          template: "incident_summary"
  
  # Stakeholder Groups
  stakeholders:
    engineering_team:
      members:
        - "engineering@resilienceai.io"
      communication:
        - "slack"
        - "pagerduty"
        - "email"
    
    executives:
      members:
        - "cto@resilienceai.io"
        - "ceo@resilienceai.io"
        - "vp-engineering@resilienceai.io"
      communication:
        - "email"
        - "slack"
    
    customers:
      members:
        - "all-customers"
      communication:
        - "status_page"
        - "email"
        - "twitter"
    
    partners:
      members:
        - "partner-contacts"
      communication:
        - "email"
  
  # Escalation Contacts
  escalation_contacts:
    level_1:
      role: "On-Call Engineer"
      contact: "+1-555-0100"
      response_time: "5 minutes"
    
    level_2:
      role: "Engineering Manager"
      contact: "+1-555-0101"
      response_time: "15 minutes"
    
    level_3:
      role: "CTO"
      contact: "+1-555-0102"
      response_time: "30 minutes"
    
    level_4:
      role: "CEO"
      contact: "+1-555-0103"
      response_time: "1 hour"

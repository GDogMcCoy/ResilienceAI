[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, with dependencies)
    e2e: End-to-end tests (full system)
    performance: Performance and load tests
    security: Security-focused tests
    slow: Tests that take longer than 1 second
    llm: Tests requiring LLM infrastructure
    geospatial: Tests requiring geospatial data
    agents: Tests for agent system
    dashboard: Tests for Streamlit dashboard
    api: Tests for external API clients
    
# Coverage settings
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70

# Async support
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning:tensorflow.*
    ignore::UserWarning:shap.*
    ignore::UserWarning:geopandas.*

# Environment variables
env =
    TESTING=true
    PYTHONPATH=.
    RESILIENCEAI_ENV=test

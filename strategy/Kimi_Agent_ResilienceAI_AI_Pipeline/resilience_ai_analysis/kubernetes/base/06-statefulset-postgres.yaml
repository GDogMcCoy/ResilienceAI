# ============================================================================
# ResilienceAI - PostgreSQL StatefulSet
# ============================================================================
# Purpose: Production-grade PostgreSQL database with persistent storage
# Features: High availability, automated backups, monitoring
# ============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: database
    database: postgres
spec:
  serviceName: postgres
  replicas: 1  # Increase to 3 with Patroni for HA
  
  selector:
    matchLabels:
      app: resilience-ai
      component: database
      database: postgres
  
  # Ordered deployment for databases
  podManagementPolicy: OrderedReady
  
  template:
    metadata:
      labels:
        app: resilience-ai
        component: database
        database: postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      serviceAccountName: resilience-ai-db-sa
      
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      
      # Node affinity for database nodes
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - database
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: component
                    operator: In
                    values:
                      - database
              topologyKey: kubernetes.io/hostname
      
      initContainers:
        # Initialize PostgreSQL data directory
        - name: init-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/postgresql/data/pgdata
              chmod 700 /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
      
      containers:
        # PostgreSQL Container
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-secrets
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=en_US.UTF-8"
          
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: 2000m
              memory: 4Gi
              ephemeral-storage: 20Gi
          
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-config
              mountPath: /etc/postgresql/postgresql.conf
              subPath: postgresql.conf
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
            - name: postgres-backup
              mountPath: /backups
          
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
                - -d
                - $(POSTGRES_DB)
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
        
        # PostgreSQL Exporter for Prometheus
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.14.0
          ports:
            - name: metrics
              containerPort: 9187
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
        
        # Backup sidecar
        - name: backup
          image: offen/docker-volume-backup:v2
          env:
            - name: BACKUP_CRON_EXPRESSION
              value: "0 2 * * *"  # Daily at 2 AM
            - name: BACKUP_RETENTION_DAYS
              value: "30"
            - name: AWS_S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-api-credentials
                  key: AWS_S3_BUCKET
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-api-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-api-credentials
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: postgres-data
              mountPath: /backup/data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      
      volumes:
        - name: postgres-config
          configMap:
            name: postgres-config
        - name: postgres-init
          configMap:
            name: postgres-init-scripts
        - name: postgres-backup
          emptyDir:
            sizeLimit: 10Gi
  
  # Persistent Volume Claim Template
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: resilience-ai
          component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd  # Use fast SSD storage
        resources:
          requests:
            storage: 100Gi

---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: database
    database: postgres
spec:
  type: ClusterIP
  selector:
    app: resilience-ai
    component: database
    database: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  # Headless service for StatefulSet
  clusterIP: None

---
# PostgreSQL ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: database
data:
  postgresql.conf: |
    # Connection Settings
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    
    # Memory Settings
    shared_buffers = 256MB
    effective_cache_size = 768MB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    
    # WAL Settings
    wal_buffers = 16MB
    checkpoint_completion_target = 0.9
    random_page_cost = 1.1
    effective_io_concurrency = 200
    
    # Logging
    logging_collector = on
    log_directory = 'log'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB
    log_min_duration_statement = 1000
    
    # Performance
    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.track = all

---
# PostgreSQL Init Scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: database
data:
  01-init-extensions.sql: |
    -- Enable required extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";  -- For text search
    
  02-create-schemas.sql: |
    -- Create application schemas
    CREATE SCHEMA IF NOT EXISTS app;
    CREATE SCHEMA IF NOT EXISTS analytics;
    CREATE SCHEMA IF NOT EXISTS audit;
    
    -- Grant permissions
    GRANT USAGE ON SCHEMA app TO resilience_ai_user;
    GRANT USAGE ON SCHEMA analytics TO resilience_ai_user;
    GRANT USAGE ON SCHEMA audit TO resilience_ai_user;

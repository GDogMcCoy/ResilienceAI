# ============================================================================
# ResilienceAI - Kubernetes Namespace Configuration
# ============================================================================
# Purpose: Isolate ResilienceAI resources in dedicated namespace
# Includes: Labels for Istio injection and monitoring
# ============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: resilience-ai
  labels:
    # Enable Istio sidecar injection
    istio-injection: enabled
    # Monitoring labels
    monitoring: enabled
    logging: enabled
    # Environment identification
    environment: production
    app.kubernetes.io/name: resilience-ai
    app.kubernetes.io/part-of: resilience-ai-platform
    app.kubernetes.io/managed-by: kubernetes
  annotations:
    description: "ResilienceAI Platform - AI-powered resilience assessment system"
    owner: "platform-team@resilienceai.com"
    cost-center: "engineering"
---
# Development namespace
apiVersion: v1
kind: Namespace
metadata:
  name: resilience-ai-dev
  labels:
    istio-injection: enabled
    monitoring: enabled
    environment: development
    app.kubernetes.io/name: resilience-ai
    app.kubernetes.io/part-of: resilience-ai-platform
  annotations:
    description: "ResilienceAI Platform - Development Environment"
---
# Staging namespace
apiVersion: v1
kind: Namespace
metadata:
  name: resilience-ai-staging
  labels:
    istio-injection: enabled
    monitoring: enabled
    environment: staging
    app.kubernetes.io/name: resilience-ai
    app.kubernetes.io/part-of: resilience-ai-platform
  annotations:
    description: "ResilienceAI Platform - Staging Environment"

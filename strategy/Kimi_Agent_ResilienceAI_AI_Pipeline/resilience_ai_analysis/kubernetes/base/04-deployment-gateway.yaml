# ============================================================================
# ResilienceAI - API Gateway Deployment
# ============================================================================
# Purpose: API Gateway for routing, authentication, and rate limiting
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-ai-gateway
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: gateway
    version: v2.0.0
spec:
  replicas: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: resilience-ai
      component: gateway
  
  template:
    metadata:
      labels:
        app: resilience-ai
        component: gateway
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: resilience-ai-sa
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values:
                        - gateway
                topologyKey: kubernetes.io/hostname
      
      containers:
        - name: gateway
          image: resilience-ai/gateway:v2.0.0
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 8081
              protocol: TCP
          
          envFrom:
            - configMapRef:
                name: resilience-ai-gateway-config
            - secretRef:
                name: resilience-ai-secrets
          
          env:
            - name: UPSTREAM_APP_URL
              value: "http://resilience-ai-app:80"
            - name: UPSTREAM_ML_URL
              value: "http://resilience-ai-ml:5000"
            - name: UPSTREAM_AUTH_URL
              value: "http://resilience-ai-auth:8080"
          
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          
          livenessProbe:
            httpGet:
              path: /health/live
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
# API Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: resilience-ai-gateway
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: gateway
spec:
  type: ClusterIP
  selector:
    app: resilience-ai
    component: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: admin
      port: 8081
      targetPort: 8081
      protocol: TCP

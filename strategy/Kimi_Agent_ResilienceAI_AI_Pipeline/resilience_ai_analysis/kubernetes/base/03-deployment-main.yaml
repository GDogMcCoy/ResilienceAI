# ============================================================================
# ResilienceAI - Main Application Deployment
# ============================================================================
# Purpose: Core ResilienceAI Streamlit application deployment
# Features: Rolling updates, health checks, resource management
# ============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: resilience-ai-app
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: frontend
    version: v2.0.0
  annotations:
    kubernetes.io/change-cause: "Initial deployment of ResilienceAI v2.0.0"
spec:
  # High availability with 3 replicas
  replicas: 3
  
  # Rolling update strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%           # Max 25% extra pods during update
      maxUnavailable: 0       # Ensure zero downtime
  
  selector:
    matchLabels:
      app: resilience-ai
      component: frontend
  
  template:
    metadata:
      labels:
        app: resilience-ai
        component: frontend
        version: v2.0.0
      annotations:
        # Force redeployment on config changes
        checksum/config: "{{ include (print $.Template.BasePath \"/01-configmaps.yaml\") . | sha256sum }}"
        checksum/secrets: "{{ include (print $.Template.BasePath \"/02-secrets.yaml\") . | sha256sum }}"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8501"
        prometheus.io/path: "/metrics"
    
    spec:
      # Service account for pod identity
      serviceAccountName: resilience-ai-sa
      
      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      
      # Topology spread for high availability
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: resilience-ai
              component: frontend
      
      # Affinity rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - resilience-ai
                topologyKey: kubernetes.io/hostname
      
      # Init containers
      initContainers:
        # Wait for database to be ready
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready!"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        
        # Run database migrations
        - name: db-migrations
          image: resilience-ai/app:v2.0.0
          command:
            - python
            - manage.py
            - migrate
          envFrom:
            - configMapRef:
                name: resilience-ai-config
            - secretRef:
                name: resilience-ai-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      # Main containers
      containers:
        - name: resilience-ai
          image: resilience-ai/app:v2.0.0
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          
          # Environment configuration
          envFrom:
            - configMapRef:
                name: resilience-ai-config
            - secretRef:
                name: resilience-ai-secrets
          
          # Additional environment variables
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          
          # Resource allocation
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
              ephemeral-storage: 2Gi
          
          # Volume mounts
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/cache
            - name: models
              mountPath: /models
              readOnly: true
          
          # Health checks
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      
      # Sidecar containers
        # Prometheus metrics exporter
        - name: metrics-exporter
          image: prometheus/node-exporter:v1.6.1
          ports:
            - name: metrics-port
              containerPort: 9100
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      
      # Volumes
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 500Mi
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: models
          persistentVolumeClaim:
            claimName: resilience-ai-models-pvc
      
      # Pod lifecycle
      terminationGracePeriodSeconds: 60
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      
      # Image pull secrets
      imagePullSecrets:
        - name: resilience-ai-registry-credentials

---
# Service for the main application
apiVersion: v1
kind: Service
metadata:
  name: resilience-ai-app
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8501"
spec:
  type: ClusterIP
  selector:
    app: resilience-ai
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

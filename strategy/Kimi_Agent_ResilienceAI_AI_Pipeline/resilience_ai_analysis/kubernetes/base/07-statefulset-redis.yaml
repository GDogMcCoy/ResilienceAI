# ============================================================================
# ResilienceAI - Redis StatefulSet
# ============================================================================
# Purpose: High-performance caching and session storage
# Features: Persistence, replication, monitoring
# ============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: cache
    cache: redis
spec:
  serviceName: redis
  replicas: 1  # Use Redis Cluster for production HA
  
  selector:
    matchLabels:
      app: resilience-ai
      component: cache
      cache: redis
  
  template:
    metadata:
      labels:
        app: resilience-ai
        component: cache
        cache: redis
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
    spec:
      serviceAccountName: resilience-ai-sa
      
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          
          command:
            - redis-server
            - /etc/redis/redis.conf
          
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 2Gi
          
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /etc/redis
          
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
        
        # Redis Exporter
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.52.0
          ports:
            - name: metrics
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resilience-ai-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
  
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app: resilience-ai
          component: cache
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 20Gi

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: cache
    cache: redis
spec:
  type: ClusterIP
  selector:
    app: resilience-ai
    component: cache
    cache: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  clusterIP: None

---
# Redis ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: cache
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    port 6379
    protected-mode yes
    
    # Authentication
    requirepass ${REDIS_PASSWORD}
    
    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    
    # RDB
    dbfilename dump.rdb
    dir /data
    rdbcompression yes
    rdbchecksum yes
    
    # AOF
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Memory
    maxmemory 1gb
    maxmemory-policy allkeys-lru
    
    # Performance
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511
    
    # Logging
    loglevel notice
    
    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128

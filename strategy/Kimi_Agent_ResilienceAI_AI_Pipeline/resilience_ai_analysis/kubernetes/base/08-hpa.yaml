# ============================================================================
# ResilienceAI - Horizontal Pod Autoscalers
# ============================================================================
# Purpose: Automatic scaling based on CPU, memory, and custom metrics
# Features: Multi-metric scaling, stabilization windows
# ============================================================================

---
# Main Application HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resilience-ai-app-hpa
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resilience-ai-app
  
  # Scaling limits
  minReplicas: 3
  maxReplicas: 20
  
  # Stabilization windows
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
  
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Custom metric: requests per second
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"
    
    # Custom metric: request latency
    - type: Pods
      pods:
        metric:
          name: http_request_duration_seconds
        target:
          type: AverageValue
          averageValue: "0.5"

---
# API Gateway HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resilience-ai-gateway-hpa
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resilience-ai-gateway
  
  minReplicas: 2
  maxReplicas: 10
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    
    # Scale based on request rate
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "2000"

---
# ML Service HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resilience-ai-ml-hpa
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: ml-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resilience-ai-ml
  
  minReplicas: 2
  maxReplicas: 10
  
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Longer for ML (models take time to load)
      policies:
        - type: Percent
          value: 10
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    
    # Custom metric: inference queue depth
    - type: Pods
      pods:
        metric:
          name: ml_inference_queue_depth
        target:
          type: AverageValue
          averageValue: "50"
    
    # Custom metric: inference latency
    - type: Pods
      pods:
        metric:
          name: ml_inference_duration_seconds
        target:
          type: AverageValue
          averageValue: "2.0"

---
# KEDA ScaledObject for event-driven scaling (alternative to HPA)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: resilience-ai-keda
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: keda
spec:
  scaleTargetRef:
    name: resilience-ai-app
  
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 3
  maxReplicaCount: 20
  
  triggers:
    # Scale based on RabbitMQ queue depth
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: assessment-jobs
        mode: QueueLength
        value: "10"
      authenticationRef:
        name: keda-rabbitmq-trigger
    
    # Scale based on Kafka lag
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: resilience-ai-consumers
        topic: assessment-events
        lagThreshold: "100"
    
    # Scale based on Prometheus metrics
    - type: prometheus
      metadata:
        serverAddress: http://prometheus:9090
        metricName: http_requests_total
        threshold: "1000"
        query: sum(rate(http_requests_total{service="resilience-ai-app"}[2m]))

# ============================================================================
# ResilienceAI - Secrets (Template - DO NOT COMMIT ACTUAL VALUES)
# ============================================================================
# Purpose: Sensitive configuration data
# SECURITY: Use external secret management (Vault, AWS Secrets Manager, etc.)
# ============================================================================

---
# Main Application Secrets
apiVersion: v1
kind: Secret
metadata:
  name: resilience-ai-secrets
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: secrets
type: Opaque
stringData:
  # Database Credentials (Base64 encoded in production)
  DB_HOST: "postgres.resilience-ai.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "resilience_ai"
  DB_USER: "resilience_ai_user"
  DB_PASSWORD: "<CHANGE_ME_IN_PRODUCTION>"
  DATABASE_URL: "postgresql://resilience_ai_user:<PASSWORD>@postgres:5432/resilience_ai"
  
  # Redis Credentials
  REDIS_HOST: "redis.resilience-ai.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "<CHANGE_ME_IN_PRODUCTION>"
  REDIS_URL: "redis://:<PASSWORD>@redis:6379/0"
  
  # JWT & Authentication
  JWT_SECRET_KEY: "<GENERATE_STRONG_SECRET>"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
  JWT_REFRESH_EXPIRATION_DAYS: "7"
  
  # API Keys
  OPENAI_API_KEY: "<YOUR_OPENAI_API_KEY>"
  ANTHROPIC_API_KEY: "<YOUR_ANTHROPIC_API_KEY>"
  HUGGINGFACE_API_KEY: "<YOUR_HF_API_KEY>"
  
  # OAuth Credentials
  GOOGLE_CLIENT_ID: "<GOOGLE_OAUTH_CLIENT_ID>"
  GOOGLE_CLIENT_SECRET: "<GOOGLE_OAUTH_CLIENT_SECRET>"
  MICROSOFT_CLIENT_ID: "<MICROSOFT_OAUTH_CLIENT_ID>"
  MICROSOFT_CLIENT_SECRET: "<MICROSOFT_OAUTH_CLIENT_SECRET>"
  
  # Encryption Keys
  ENCRYPTION_KEY: "<32_BYTE_ENCRYPTION_KEY>"
  DATA_ENCRYPTION_KEY: "<32_BYTE_DATA_KEY>"
  
  # Webhook Secrets
  WEBHOOK_SECRET: "<WEBHOOK_SIGNING_SECRET>"
  
  # SMTP Configuration
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "<SENDGRID_API_KEY>"
  
  # Monitoring & Observability
  DATADOG_API_KEY: "<DATADOG_API_KEY>"
  NEWRELIC_LICENSE_KEY: "<NEWRELIC_LICENSE_KEY>"
  SENTRY_DSN: "<SENTRY_DSN_URL>"

---
# TLS Secrets (for internal mTLS)
apiVersion: v1
kind: Secret
metadata:
  name: resilience-ai-tls
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: tls
type: kubernetes.io/tls
data:
  # These are base64 encoded certificates
  # Generate with: openssl req -x509 -nodes -days 365 -newkey rsa:2048
  tls.crt: "<BASE64_ENCODED_CERTIFICATE>"
  tls.key: "<BASE64_ENCODED_PRIVATE_KEY>"

---
# External API Credentials
apiVersion: v1
kind: Secret
metadata:
  name: resilience-ai-api-credentials
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: api-credentials
type: Opaque
stringData:
  # Third-party service credentials
  STRIPE_API_KEY: "<STRIPE_API_KEY>"
  STRIPE_WEBHOOK_SECRET: "<STRIPE_WEBHOOK_SECRET>"
  
  # Cloud Storage
  AWS_ACCESS_KEY_ID: "<AWS_ACCESS_KEY>"
  AWS_SECRET_ACCESS_KEY: "<AWS_SECRET_KEY>"
  AWS_S3_BUCKET: "resilience-ai-data"
  
  # Azure Storage
  AZURE_STORAGE_ACCOUNT: "<AZURE_ACCOUNT>"
  AZURE_STORAGE_KEY: "<AZURE_KEY>"
  
  # GCP Storage
  GCP_SERVICE_ACCOUNT_KEY: "<GCP_SA_KEY_JSON>"
  GCP_STORAGE_BUCKET: "resilience-ai-data"

---
# Database Admin Credentials (for migrations)
apiVersion: v1
kind: Secret
metadata:
  name: resilience-ai-db-admin
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: database
type: Opaque
stringData:
  DB_ADMIN_USER: "postgres"
  DB_ADMIN_PASSWORD: "<ADMIN_PASSWORD>"
  DB_MIGRATION_USER: "migration_user"
  DB_MIGRATION_PASSWORD: "<MIGRATION_PASSWORD>"

---
# External Secrets Operator Integration
# Use this with External Secrets Operator to sync from Vault/AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: resilience-ai-external-secrets
  namespace: resilience-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: resilience-ai-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: resilience-ai/database
        property: password
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: resilience-ai/auth
        property: jwt-secret
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: resilience-ai/api-keys
        property: openai

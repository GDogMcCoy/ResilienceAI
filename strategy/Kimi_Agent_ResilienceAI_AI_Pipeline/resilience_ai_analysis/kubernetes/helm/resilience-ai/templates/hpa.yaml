{{/* ============================================================================
ResilienceAI - Horizontal Pod Autoscaler Template
============================================================================ */}}
{{- if .Values.app.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "resilience-ai.fullname" . }}-app-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resilience-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "resilience-ai.fullname" . }}-app
  
  minReplicas: {{ .Values.app.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.app.autoscaling.maxReplicas }}
  
  {{- if .Values.app.autoscaling.behavior }}
  behavior:
    {{- toYaml .Values.app.autoscaling.behavior | nindent 4 }}
  {{- end }}
  
  metrics:
    {{- if .Values.app.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    
    {{- if .Values.app.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.app.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}

---
{{- if .Values.gateway.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "resilience-ai.fullname" . }}-gateway-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resilience-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "resilience-ai.fullname" . }}-gateway
  
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.gateway.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

---
{{- if .Values.ml.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "resilience-ai.fullname" . }}-ml-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resilience-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "resilience-ai.fullname" . }}-ml
  
  minReplicas: {{ .Values.ml.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ml.autoscaling.maxReplicas }}
  
  {{- if .Values.ml.autoscaling.scaleDownStabilizationWindow }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.ml.autoscaling.scaleDownStabilizationWindow }}
  {{- end }}
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ml.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

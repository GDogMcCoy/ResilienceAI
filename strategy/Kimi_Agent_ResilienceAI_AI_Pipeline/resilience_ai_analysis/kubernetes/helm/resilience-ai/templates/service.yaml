{{/* ============================================================================
ResilienceAI - Service Template
============================================================================ */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resilience-ai.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resilience-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8501"
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "resilience-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: {{ .Values.app.service.targetPort }}
      protocol: TCP
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  sessionAffinity: None

---
# Gateway Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resilience-ai.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resilience-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "resilience-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.targetPort }}
      protocol: TCP

---
# ML Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "resilience-ai.fullname" . }}-ml
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "resilience-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-service
spec:
  type: {{ .Values.ml.service.type }}
  selector:
    {{- include "resilience-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ml-service
  ports:
    - name: http
      port: {{ .Values.ml.service.ports.http }}
      targetPort: {{ .Values.ml.service.ports.http }}
      protocol: TCP
    - name: grpc
      port: {{ .Values.ml.service.ports.grpc }}
      targetPort: {{ .Values.ml.service.ports.grpc }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.ml.service.ports.metrics }}
      targetPort: {{ .Values.ml.service.ports.metrics }}
      protocol: TCP

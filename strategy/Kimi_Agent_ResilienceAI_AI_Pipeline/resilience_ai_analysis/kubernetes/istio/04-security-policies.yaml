# ============================================================================
# ResilienceAI - Istio Security Policies
# ============================================================================
# Purpose: Authorization, authentication, and security policies
# ============================================================================

---
# Default deny-all policy (zero-trust)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
spec:
  {}

---
# Allow ingress gateway traffic
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
spec:
  selector:
    matchLabels:
      app: resilience-ai
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"

---
# Application-specific authorization
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: resilience-ai-app-authz
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
    service: app
spec:
  selector:
    matchLabels:
      app: resilience-ai
      component: frontend
  action: ALLOW
  rules:
    # Allow health checks from anywhere
    - to:
        - operation:
            paths:
              - /health/live
              - /health/ready
              - /health/startup
    
    # Allow traffic from gateway
    - from:
        - source:
            principals:
              - "cluster.local/ns/resilience-ai/sa/resilience-ai-sa"
      to:
        - operation:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
            paths:
              - /api/*
              - /assessments/*
              - /reports/*

---
# ML Service authorization
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: resilience-ai-ml-authz
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
    service: ml
spec:
  selector:
    matchLabels:
      app: resilience-ai
      component: ml-service
  action: ALLOW
  rules:
    # Allow from app and gateway only
    - from:
        - source:
            principals:
              - "cluster.local/ns/resilience-ai/sa/resilience-ai-sa"
      to:
        - operation:
            methods:
              - POST
            paths:
              - /inference
              - /predict
              - /batch
    
    # Health checks
    - to:
        - operation:
            paths:
              - /health/*

---
# Database authorization
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: postgres-authz
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
    service: database
spec:
  selector:
    matchLabels:
      app: resilience-ai
      component: database
  action: ALLOW
  rules:
    # Only allow from app and migration jobs
    - from:
        - source:
            principals:
              - "cluster.local/ns/resilience-ai/sa/resilience-ai-sa"
              - "cluster.local/ns/resilience-ai/sa/resilience-ai-db-sa"

---
# Request Authentication (JWT validation)
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: resilience-ai-jwt
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
spec:
  selector:
    matchLabels:
      app: resilience-ai
      component: gateway
  jwtRules:
    - issuer: "https://auth.resilienceai.com"
      jwksUri: "https://auth.resilienceai.com/.well-known/jwks.json"
      audiences:
        - "resilience-ai-api"
      forwardOriginalToken: true
      outputPayloadToHeader: x-jwt-payload
    
    - issuer: "https://accounts.google.com"
      jwksUri: "https://www.googleapis.com/oauth2/v3/certs"
      audiences:
        - "<GOOGLE_CLIENT_ID>"

---
# Rate limiting with Envoy filter
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: resilience-ai-rate-limit
  namespace: istio-system
  labels:
    app: resilience-ai
    component: rate-limit
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            value:
              stat_prefix: http_local_rate_limiter
              token_bucket:
                max_tokens: 1000
                tokens_per_fill: 100
                fill_interval: 1s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
                - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  header:
                    key: x-local-rate-limit
                    value: 'true'

---
# Network policy for additional security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: resilience-ai-network-policy
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
spec:
  podSelector:
    matchLabels:
      app: resilience-ai
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from istio ingress gateway
    - from:
        - namespaceSelector:
            matchLabels:
              name: istio-system
        - podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8501
    
    # Allow from same namespace
    - from:
        - podSelector: {}
  egress:
    # Allow to same namespace
    - to:
        - podSelector: {}
    
    # Allow to kube-dns
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    
    # Allow to istio-system
    - to:
        - namespaceSelector:
            matchLabels:
              name: istio-system

# ============================================================================
# ResilienceAI - Istio Gateway Configuration
# ============================================================================
# Purpose: External traffic entry point with TLS termination
# ============================================================================

apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: resilience-ai-gateway
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: istio-gateway
spec:
  selector:
    istio: ingressgateway  # Use Istio's default ingress gateway
  servers:
    # HTTP - Redirect to HTTPS
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "resilienceai.com"
        - "*.resilienceai.com"
        - "app.resilienceai.com"
        - "api.resilienceai.com"
      tls:
        httpsRedirect: true  # Redirect HTTP to HTTPS
    
    # HTTPS - Primary traffic
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "resilienceai.com"
        - "*.resilienceai.com"
        - "app.resilienceai.com"
        - "api.resilienceai.com"
      tls:
        mode: SIMPLE
        credentialName: resilience-ai-tls-secret  # TLS certificate
        minProtocolVersion: TLSV1_2
        cipherSuites:
          - ECDHE-RSA-AES256-GCM-SHA384
          - ECDHE-RSA-AES128-GCM-SHA256
    
    # gRPC over TLS
    - port:
        number: 50051
        name: grpc
        protocol: GRPC
      hosts:
        - "api.resilienceai.com"
      tls:
        mode: SIMPLE
        credentialName: resilience-ai-tls-secret

---
# Certificate for TLS (using cert-manager)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: resilience-ai-tls
  namespace: istio-system
spec:
  secretName: resilience-ai-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "resilienceai.com"
    - "*.resilienceai.com"
    - "app.resilienceai.com"
    - "api.resilienceai.com"
  duration: 2160h  # 90 days
  renewBefore: 360h  # 15 days
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth

---
# ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@resilienceai.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: istio
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: ZXXXXXXXXXXXXX

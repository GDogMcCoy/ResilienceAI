# ============================================================================
# ResilienceAI - Istio VirtualServices
# ============================================================================
# Purpose: Traffic routing, canary deployments, A/B testing
# ============================================================================

---
# Main Application VirtualService
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: resilience-ai-app-vs
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: virtualservice
spec:
  hosts:
    - "app.resilienceai.com"
    - "resilienceai.com"
  gateways:
    - resilience-ai-gateway
    - mesh  # Internal mesh access
  http:
    # Health check route (no auth required)
    - match:
        - uri:
            prefix: /health
      route:
        - destination:
            host: resilience-ai-app
            port:
              number: 80
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
    
    # Static assets route
    - match:
        - uri:
            prefix: /static
      route:
        - destination:
            host: resilience-ai-app
            port:
              number: 80
      timeout: 30s
      
    # Main application route with canary
    - route:
        - destination:
            host: resilience-ai-app
            subset: stable
            port:
              number: 80
          weight: 90
        - destination:
            host: resilience-ai-app
            subset: canary
            port:
              number: 80
          weight: 10
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 20s
        retryOn: gateway-error,connect-failure,refused-stream,unavailable
      fault:
        delay:
          percentage:
            value: 0.1  # 0.1% chaos testing
          fixedDelay: 5s
      corsPolicy:
        allowOrigins:
          - exact: "https://resilienceai.com"
          - exact: "https://app.resilienceai.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowHeaders:
          - authorization
          - content-type
          - x-request-id
        allowCredentials: true
        maxAge: "24h"

---
# API Gateway VirtualService
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: resilience-ai-api-vs
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: virtualservice
    type: api
spec:
  hosts:
    - "api.resilienceai.com"
  gateways:
    - resilience-ai-gateway
  http:
    # API Documentation
    - match:
        - uri:
            exact: /docs
        - uri:
            prefix: /swagger
        - uri:
            prefix: /openapi
      route:
        - destination:
            host: resilience-ai-gateway
            port:
              number: 80
    
    # Authentication endpoints
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: resilience-ai-auth
            port:
              number: 8080
      timeout: 10s
    
    # Assessment API
    - match:
        - uri:
            prefix: /api/v1/assessments
      route:
        - destination:
            host: resilience-ai-gateway
            port:
              number: 80
      timeout: 120s
      retries:
        attempts: 3
        perTryTimeout: 40s
    
    # ML Inference API
    - match:
        - uri:
            prefix: /api/v1/inference
      route:
        - destination:
            host: resilience-ai-ml
            port:
              number: 5000
      timeout: 300s
      retries:
        attempts: 2
        perTryTimeout: 150s
    
    # Default API route
    - route:
        - destination:
            host: resilience-ai-gateway
            port:
              number: 80
      timeout: 30s
      corsPolicy:
        allowOrigins:
          - regex: "https://.*resilienceai.com"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowHeaders:
          - "*"
        allowCredentials: true

---
# ML Service gRPC VirtualService
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: resilience-ai-ml-grpc-vs
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: virtualservice
    type: grpc
spec:
  hosts:
    - "ml.resilienceai.com"
    - "api.resilienceai.com"
  gateways:
    - resilience-ai-gateway
  http:
    - match:
        - port: 50051
          protocol: grpc
      route:
        - destination:
            host: resilience-ai-ml
            port:
              number: 50051
      timeout: 300s
      retries:
        attempts: 2
        perTryTimeout: 150s

---
# Internal Service Mesh Routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: resilience-ai-internal-vs
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: virtualservice
    type: internal
spec:
  hosts:
    - resilience-ai-app
    - resilience-ai-gateway
    - resilience-ai-ml
  http:
    # Circuit breaker pattern
    - route:
        - destination:
            host: resilience-ai-app
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: gateway-error,connect-failure,refused-stream
      timeout: 30s

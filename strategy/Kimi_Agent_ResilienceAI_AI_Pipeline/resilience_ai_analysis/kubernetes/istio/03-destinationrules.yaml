# ============================================================================
# ResilienceAI - Istio DestinationRules
# ============================================================================
# Purpose: Traffic policies, load balancing, circuit breakers, subsets
# ============================================================================

---
# Main Application DestinationRule
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: resilience-ai-app-dr
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: destinationrule
spec:
  host: resilience-ai-app
  trafficPolicy:
    # Connection pool settings
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30ms
        tcpKeepalive:
          time: 300s
          interval: 75s
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 100
        maxRetries: 3
    
    # Load balancing
    loadBalancer:
      simple: LEAST_REQUEST
      localityLbSetting:
        enabled: true
        distribute:
          - from: us-east-1/*
            to:
              "us-east-1a": 40
              "us-east-1b": 35
              "us-east-1c": 25
    
    # Outlier detection (circuit breaker)
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      consecutiveGatewayErrors: 3
    
    # Retry policy
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream
  
  # Subsets for canary deployments
  subsets:
    - name: stable
      labels:
        version: v2.0.0
      trafficPolicy:
        connectionPool:
          http:
            http2MaxRequests: 1000
    
    - name: canary
      labels:
        version: v2.1.0-canary
      trafficPolicy:
        connectionPool:
          http:
            http2MaxRequests: 100

---
# API Gateway DestinationRule
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: resilience-ai-gateway-dr
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: destinationrule
    type: gateway
spec:
  host: resilience-ai-gateway
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 200
      http:
        http2MaxRequests: 2000
        maxRequestsPerConnection: 200
    
    loadBalancer:
      simple: ROUND_ROBIN
    
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
  
  subsets:
    - name: v1
      labels:
        version: v2.0.0

---
# ML Service DestinationRule
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: resilience-ai-ml-dr
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: destinationrule
    type: ml
spec:
  host: resilience-ai-ml
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 5s
      http:
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
        maxRetries: 2
    
    loadBalancer:
      simple: LEAST_REQUEST  # Send to least loaded ML instance
    
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 60s
      baseEjectionTime: 120s
      maxEjectionPercent: 30
    
    # Longer timeouts for ML inference
    portLevelSettings:
      - port:
          number: 5000
        connectionPool:
          http:
            http2MaxRequests: 50
        outlierDetection:
          consecutive5xxErrors: 5
          interval: 120s
  
  subsets:
    - name: cpu
      labels:
        accelerator: cpu
    
    - name: gpu
      labels:
        accelerator: gpu

---
# Database DestinationRule (for sidecar communication)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: postgres-dr
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: destinationrule
    type: database
spec:
  host: postgres
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 5s
    
    loadBalancer:
      simple: ROUND_ROBIN
    
    # mTLS for database connections
    tls:
      mode: ISTIO_MUTUAL
  
  subsets:
    - name: primary
      labels:
        role: primary
    
    - name: replica
      labels:
        role: replica

---
# Redis DestinationRule
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: redis-dr
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: destinationrule
    type: cache
spec:
  host: redis
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 2s
    
    loadBalancer:
      simple: RANDOM
    
    tls:
      mode: ISTIO_MUTUAL

---
# PeerAuthentication for mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: resilience-ai-mtls
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: security
spec:
  mtls:
    mode: STRICT  # Enforce mTLS for all services

---
# Namespace-wide mTLS
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: resilience-ai
spec:
  mtls:
    mode: STRICT

# ============================================================================
# ResilienceAI - Prometheus ServiceMonitor Configuration
# ============================================================================

---
# ServiceMonitor for Main Application
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: resilience-ai-app-metrics
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: monitoring
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - resilience-ai
  selector:
    matchLabels:
      app: resilience-ai
      component: frontend
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'go_.*'
          action: drop

---
# ServiceMonitor for API Gateway
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: resilience-ai-gateway-metrics
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: monitoring
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - resilience-ai
  selector:
    matchLabels:
      app: resilience-ai
      component: gateway
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

---
# ServiceMonitor for ML Service
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: resilience-ai-ml-metrics
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: monitoring
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - resilience-ai
  selector:
    matchLabels:
      app: resilience-ai
      component: ml-service
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s

---
# ServiceMonitor for PostgreSQL
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-metrics
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: monitoring
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - resilience-ai
  selector:
    matchLabels:
      app: resilience-ai
      component: database
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# PrometheusRules for Alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resilience-ai-alerts
  namespace: resilience-ai
  labels:
    app: resilience-ai
    component: monitoring
    release: prometheus
spec:
  groups:
    - name: resilience-ai
      rules:
        # High error rate alert
        - alert: ResilienceAIHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{service="resilience-ai-app",status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{service="resilience-ai-app"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: "Error rate is above 5% for more than 5 minutes"
        
        # High latency alert
        - alert: ResilienceAIHighLatency
          expr: |
            histogram_quantile(0.95, 
              sum(rate(http_request_duration_seconds_bucket{service="resilience-ai-app"}[5m])) by (le)
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High latency detected"
            description: "95th percentile latency is above 2 seconds"
        
        # Pod crash loop
        - alert: ResilienceAIPodCrashLoop
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="resilience-ai"}[15m]) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod is in crash loop"
            description: "Pod {{ $labels.pod }} is restarting frequently"
        
        # Database connection issues
        - alert: ResilienceAIDBConnectionIssues
          expr: |
            pg_up{namespace="resilience-ai"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database is down"
            description: "PostgreSQL database is not responding"
        
        # ML service unavailable
        - alert: ResilienceAIMLServiceDown
          expr: |
            up{job="resilience-ai-ml-metrics"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "ML service is down"
            description: "ML inference service is not available"
        
        # High CPU usage
        - alert: ResilienceAIHighCPU
          expr: |
            (
              sum(rate(container_cpu_usage_seconds_total{namespace="resilience-ai",container!=""}[5m]))
              /
              sum(kube_pod_container_resource_limits{namespace="resilience-ai",resource="cpu"})
            ) > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage"
            description: "CPU usage is above 80% for more than 10 minutes"
        
        # High memory usage
        - alert: ResilienceAIHighMemory
          expr: |
            (
              sum(container_memory_working_set_bytes{namespace="resilience-ai",container!=""})
              /
              sum(kube_pod_container_resource_limits{namespace="resilience-ai",resource="memory"})
            ) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage"
            description: "Memory usage is above 85% for more than 10 minutes"
        
        # Certificate expiration
        - alert: ResilienceAICertificateExpiring
          expr: |
            (
              certmanager_certificate_expiration_timestamp_seconds{namespace="resilience-ai"}
              - time()
            ) / 86400 < 30
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "TLS certificate expiring soon"
            description: "Certificate will expire in less than 30 days"

# AWS S3 for model storage
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: aws-s3
  namespace: resilience-ai
spec:
  hosts:
  - s3.amazonaws.com
  - "*.s3.amazonaws.com"
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  resolution: DNS
  location: MESH_EXTERNAL
---
# Redis cache
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: redis-cache
  namespace: resilience-ai
spec:
  hosts:
  - redis-cache.resilience-ai.svc.cluster.local
  ports:
  - number: 6379
    name: redis
    protocol: TCP
  resolution: DNS
  location: MESH_INTERNAL
---
# PostgreSQL database
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: postgres-db
  namespace: resilience-ai
spec:
  hosts:
  - postgres.resilience-ai.svc.cluster.local
  ports:
  - number: 5432
    name: postgres
    protocol: TCP
  resolution: DNS
  location: MESH_INTERNAL
---
# External ML API (e.g., OpenAI)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-ml-api
  namespace: resilience-ai
spec:
  hosts:
  - api.openai.com
  - api.anthropic.com
  ports:
  - number: 443
    name: https
    protocol: HTTPS
  resolution: DNS
  location: MESH_EXTERNAL
---
# Prometheus monitoring
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: prometheus-monitoring
  namespace: resilience-ai
spec:
  hosts:
  - prometheus.monitoring.svc.cluster.local
  ports:
  - number: 9090
    name: http
    protocol: HTTP
  resolution: DNS
  location: MESH_INTERNAL

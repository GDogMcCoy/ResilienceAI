apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: retry-policies
  namespace: resilience-ai
spec:
  hosts:
  - ml-engine
  - auth-service
  - analytics-service
  http:
  # ML Engine - Retry on transient failures
  - match:
    - sourceLabels:
        app: api-gateway
    route:
    - destination:
        host: ml-engine
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream,cancelled,deadline-exceeded,unavailable,internal
      retriableStatusCodes:
      - 503
      - 504
    timeout: 30s
    
  # Auth Service - Quick retries
  - match:
    - sourceLabels:
        app: api-gateway
    route:
    - destination:
        host: auth-service
    retries:
      attempts: 2
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream
    timeout: 5s
    
  # Analytics Service - Longer retries for heavy queries
  - match:
    - sourceLabels:
        app: api-gateway
    route:
    - destination:
        host: analytics-service
    retries:
      attempts: 5
      perTryTimeout: 30s
      retryOn: gateway-error,connect-failure,refused-stream,unavailable
    timeout: 120s

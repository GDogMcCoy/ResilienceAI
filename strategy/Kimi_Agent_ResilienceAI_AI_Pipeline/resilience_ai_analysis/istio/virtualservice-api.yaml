apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: resilience-ai
spec:
  hosts:
  - "api.resilience-ai.example.com"
  gateways:
  - resilience-ai-gateway
  http:
  # Authentication routes
  - match:
    - uri:
        prefix: /api/v1/auth
    route:
    - destination:
        host: auth-service
        port:
          number: 8080
    timeout: 5s
    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: gateway-error,connect-failure,refused-stream
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 5s
    
  # ML Engine routes
  - match:
    - uri:
        prefix: /api/v1/ml
    route:
    - destination:
        host: ml-engine
        port:
          number: 8080
      weight: 100
    timeout: 30s
    retries:
      attempts: 2
      perTryTimeout: 15s
      retryOn: gateway-error,connect-failure,refused-stream,cancelled,deadline-exceeded
    corsPolicy:
      allowOrigins:
      - exact: "https://resilience-ai.example.com"
      - exact: "https://app.resilience-ai.example.com"
      allowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      allowHeaders:
      - authorization
      - content-type
      - x-request-id
      allowCredentials: true
      maxAge: "24h"
    
  # Analytics routes
  - match:
    - uri:
        prefix: /api/v1/analytics
    route:
    - destination:
        host: analytics-service
        port:
          number: 8080
    timeout: 10s
    retries:
      attempts: 3
      perTryTimeout: 3s
    
  # Prediction routes - High priority
  - match:
    - uri:
        prefix: /api/v1/predict
    - headers:
        x-priority:
          exact: high
    route:
    - destination:
        host: ml-engine
        port:
          number: 8080
        subset: stable
      weight: 90
    - destination:
        host: ml-engine
        port:
          number: 8080
        subset: canary
      weight: 10
    timeout: 5s
    
  # Default routes
  - route:
    - destination:
        host: api-gateway
        port:
          number: 8080
    timeout: 10s
    retries:
      attempts: 3
      perTryTimeout: 3s
---
# Web UI VirtualService
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: web-ui-vs
  namespace: resilience-ai
spec:
  hosts:
  - "resilience-ai.example.com"
  - "app.resilience-ai.example.com"
  gateways:
  - resilience-ai-gateway
  http:
  # Static assets - Long cache
  - match:
    - uri:
        prefix: /static/
    route:
    - destination:
        host: web-ui
        port:
          number: 80
    cache:
      maxAge: 1h
    
  # API calls
  - match:
    - uri:
        prefix: /api/
    route:
    - destination:
        host: api-gateway
        port:
          number: 8080
    
  # Default - Serve React app
  - route:
    - destination:
        host: web-ui
        port:
          number: 80

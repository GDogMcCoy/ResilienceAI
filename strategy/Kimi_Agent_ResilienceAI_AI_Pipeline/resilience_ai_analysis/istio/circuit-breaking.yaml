# ML Engine Circuit Breaker
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ml-engine-circuit-breaker
  namespace: resilience-ai
spec:
  host: ml-engine
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30ms
        tcpKeepalive:
          time: 300s
          interval: 75s
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 100
        maxRetries: 3
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      # Eject host after 5 consecutive 5xx errors
      consecutive5xxErrors: 5
      # Check interval
      interval: 10s
      # Base ejection time (increases with each ejection)
      baseEjectionTime: 30s
      # Maximum percentage of hosts that can be ejected
      maxEjectionPercent: 50
      # Also consider gateway errors
      consecutiveGatewayErrors: 3
      # Consider local origin failures
      consecutiveLocalOriginFailures: 5
      # Success rate criteria
      successRate:
        minimumHosts: 3
        requestVolume: 100
        standardDeviationFactor: 1.4
---
# Auth Service Circuit Breaker - More strict
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: auth-service-circuit-breaker
  namespace: resilience-ai
spec:
  host: auth-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
        connectTimeout: 50ms
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 50
        maxRetries: 2
    loadBalancer:
      simple: ROUND_ROBIN
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 60s
      maxEjectionPercent: 30
      consecutiveGatewayErrors: 2
---
# Analytics Service Circuit Breaker
apiVersion: networking.istio.io/v1beta1

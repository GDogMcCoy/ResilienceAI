# Deny all by default
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: resilience-ai
spec:
  {}
---
# Allow ingress gateway to all services
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress
  namespace: resilience-ai
spec:
  selector:
    matchLabels:
      app: api-gateway
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account
---
# ML Engine authorization
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: ml-engine-authz
  namespace: resilience-ai
spec:
  selector:
    matchLabels:
      app: ml-engine
  action: ALLOW
  rules:
  # Allow from API Gateway
  - from:
    - source:
        principals:
        - cluster.local/ns/resilience-ai/sa/api-gateway
    to:
    - operation:
        methods:
        - GET
        - POST
        paths:
        - /api/v1/predict
        - /api/v1/ml/*
        - /health
        - /ready
  
  # Allow internal services
  - from:
    - source:
        principals:
        - cluster.local/ns/resilience-ai/sa/analytics-service
        - cluster.local/ns/resilience-ai/sa/notification-service
    to:
    - operation:
        methods:
        - GET
        - POST
        paths:
        - /api/v1/ml/models/*
  
  # Allow admin role for model management
  - from:
    - source:
        requestPrincipals:
        - "*"
    to:
    - operation:
        methods:
        - POST
        - PUT
        - DELETE
        paths:
        - /api/v1/ml/models
        - /api/v1/ml/models/*
        - /api/v1/ml/training/*
    when:
    - key: request.auth.claims[roles]
      values:
      - "admin"
      - "ml-engineer"
---
# Auth Service - Allow public access to login/register
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: auth-service-public
  namespace: resilience-ai
spec:
  selector:
    matchLabels:
      app: auth-service
  action: ALLOW
  rules:
  - to:
    - operation:
        methods:
        - POST
        paths:
        - /api/v1/auth/login
        - /api/v1/auth/register
        - /api/v1/auth/refresh
        - /api/v1/auth/forgot-password
        - /api/v1/auth/reset-password
        - /.well-known/jwks.json
  - to:
    - operation:
        methods:
        - GET
        paths:
        - /health
        - /ready
        - /metrics
---
# Analytics Service - Role-based access
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: analytics-service-authz
  namespace: resilience-ai
spec:
  selector:
    matchLabels:
      app: analytics-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/resilience-ai/sa/api-gateway
        - cluster.local/ns/resilience-ai/sa/ml-engine
    to:
    - operation:
        methods:
        - GET
        - POST
        paths:
        - /api/v1/analytics/*
  
  # Admin access to all analytics
  - from:
    - source:
        requestPrincipals:
        - "*"
    to:
    - operation:
        methods:
        - GET
        - POST
        - DELETE
        paths:
        - /api/v1/analytics/admin/*
    when:
    - key: request.auth.claims[roles]
      values:
      - "admin"
      - "analyst"
---
# Notification Service - Internal only
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: notification-service-authz
  namespace: resilience-ai
spec:
  selector:
    matchLabels:
      app: notification-service
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster.local/ns/resilience-ai/sa/api-gateway
        - cluster.local/ns/resilience-ai/sa/ml-engine
        - cluster.local/ns/resilience-ai/sa/analytics-service
        - cluster.local/ns/resilience-ai/sa/auth-service
    to:
    - operation:
        methods:
        - POST
        paths:
        - /api/v1/notifications/*
        - /api/v1/notifications/email
        - /api/v1/notifications/slack
        - /api/v1/notifications/webhook
